<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff | BathFoodFinder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>{{ food.name }}</h1>
<p>Outlet: {{ food.outlet }}</p>
<p>Saved allergens: {{ food.allergens or "Not recorded" }}</p>
<a href="{{ url_for('choose_food') }}">Choose another food</a>

<form action="{{ url_for('publish_offer') }}" method="post">
    <input type="hidden" name="food_item_id" value="{{ food.id }}">

    <label for="price">Price (£)</label>
    <input id="price" name="price" type="number" min="0" step="0.01" required>

    <label for="portions">Portions available</label>
    <input id="portions" name="portions" type="number" min="1" step="1" required>

    <label for="deadline">Collect by today</label>
    <input id="deadline" name="deadline" type="time" required>

    <button type="submit">Publish offer</button>
</form>
